<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing Detective</title>
<style>
  :root{
    --bg-deep:#0a0e17;
    --bg-panel:#101623;
    --cork:#1a2233;
    --cork-edge:#0d1220;
    --accent:#3fa9f5;
    --accent-glow:rgba(63,169,245,0.55);
    --accent-dim:#1c5680;
    --gold:#e8b34c;
    --paper:#f3ecd8;
    --paper-shadow:rgba(0,0,0,0.55);
    --ink:#22252b;
    --danger:#ef5b5b;
    --success:#57d68d;
    --text-soft:#b9c4d6;
    --text-dim:#7386a3;
    --sticky1:#f7e07a;
    --sticky2:#8fd4ef;
    --sticky3:#f6a5c0;
    --sticky4:#b7f0a0;
    --pin:#e8b34c;
    --font-display: 'Georgia', 'Times New Roman', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at top, #14202f 0%, var(--bg-deep) 60%);
    color:var(--text-soft);
    font-family:var(--font-body);
    min-height:100vh;
    overflow-x:hidden;
  }

  /* subtle noise/vignette overlay */
  body::before{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, transparent 1px, transparent 2px),
      radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
    z-index:9999;
  }

  #app{ position:relative; min-height:100vh; }

  .screen{
    display:none;
    animation: fadeIn .6s ease;
    min-height:100vh;
    padding:24px;
  }
  .screen.active{ display:block; }

  @keyframes fadeIn{
    from{opacity:0; transform:translateY(12px);}
    to{opacity:1; transform:translateY(0);}
  }

  /* ---------- Header ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    max-width:1200px; margin:0 auto 22px auto;
    padding-bottom:14px;
    border-bottom:1px solid rgba(63,169,245,0.15);
  }
  .brand{
    font-family:var(--font-display);
    font-size:1.5rem;
    letter-spacing:1px;
    color:var(--paper);
    display:flex; align-items:center; gap:10px;
  }
  .brand .badge{
    width:34px;height:34px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--accent), var(--accent-dim));
    box-shadow:0 0 16px var(--accent-glow);
    display:flex;align-items:center;justify-content:center;
    font-size:1.1rem;
  }
  .case-tag{
    font-size:0.78rem; color:var(--text-dim); letter-spacing:1px;
    border:1px solid rgba(255,255,255,0.08); padding:6px 12px; border-radius:20px;
    background:rgba(255,255,255,0.02);
  }

  .progress-track{
    max-width:1200px;margin:0 auto 26px auto;
    display:flex; gap:6px;
  }
  .progress-seg{
    flex:1; height:5px; border-radius:3px; background:rgba(255,255,255,0.08);
    overflow:hidden; position:relative;
  }
  .progress-seg.done{ background:linear-gradient(90deg, var(--accent-dim), var(--accent)); box-shadow:0 0 8px var(--accent-glow);}
  .progress-seg.current::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: sweep 1.6s linear infinite;
  }
  @keyframes sweep{ from{transform:translateX(-100%);} to{transform:translateX(100%);} }

  /* ---------- Buttons ---------- */
  .btn{
    font-family:var(--font-body);
    background:linear-gradient(180deg, #17324a, #0d2131);
    border:1px solid var(--accent-dim);
    color:var(--paper);
    padding:12px 22px;
    border-radius:8px;
    cursor:pointer;
    font-size:0.95rem;
    letter-spacing:0.4px;
    transition: all .25s ease;
    box-shadow: 0 2px 0 rgba(0,0,0,0.4), 0 0 0 rgba(0,0,0,0);
  }
  .btn:hover{
    background:linear-gradient(180deg, #1d425f, #10293b);
    box-shadow:0 4px 14px var(--accent-glow);
    transform:translateY(-2px);
    border-color:var(--accent);
  }
  .btn:active{ transform:translateY(0); }
  .btn.primary{
    background:linear-gradient(180deg, var(--accent), var(--accent-dim));
    color:#08131f; font-weight:700; border:1px solid var(--accent);
  }
  .btn.primary:hover{ box-shadow:0 6px 22px var(--accent-glow); }
  .btn.ghost{ background:transparent; border:1px solid rgba(255,255,255,0.15); }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; transform:none; box-shadow:none; }
  .btn-row{ display:flex; gap:12px; flex-wrap:wrap; }

  /* ---------- Theme Picker (initial) ---------- */
  .center-wrap{
    min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column;
    text-align:center; padding:20px;
  }
  .title-hero{
    font-family:var(--font-display);
    font-size:clamp(2rem, 5vw, 3.4rem);
    color:var(--paper);
    margin-bottom:6px;
    text-shadow:0 0 30px rgba(63,169,245,0.25);
    letter-spacing:1px;
  }
  .subtitle-hero{ color:var(--text-dim); margin-bottom:34px; font-size:1.05rem; max-width:560px;}

  /* ---------- Case Assignment (dossier) ---------- */
  .dossier{
    max-width:760px; margin:40px auto; background:var(--paper);
    color:var(--ink); border-radius:4px; padding:38px 42px;
    box-shadow:0 20px 60px rgba(0,0,0,0.6), 0 0 0 6px rgba(0,0,0,0.15) inset;
    position:relative;
    background-image:
      linear-gradient(rgba(0,0,0,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.02) 1px, transparent 1px);
    background-size:24px 24px;
    transform:rotate(-0.4deg);
    animation: dropIn .7s cubic-bezier(.2,.9,.3,1.1);
  }
  @keyframes dropIn{
    from{ opacity:0; transform:translateY(-60px) rotate(-4deg); }
    to{ opacity:1; transform:translateY(0) rotate(-0.4deg); }
  }
  .dossier .stamp{
    position:absolute; top:24px; right:30px;
    border:3px solid var(--danger); color:var(--danger);
    padding:6px 14px; font-weight:800; letter-spacing:2px;
    transform:rotate(8deg); font-size:0.85rem; border-radius:4px;
    opacity:0.85;
  }
  .dossier h2{ font-family:var(--font-display); margin-top:0; font-size:1.8rem; }
  .dossier .field{ margin-bottom:14px; }
  .dossier .field label{ display:block; font-size:0.72rem; text-transform:uppercase; letter-spacing:1.5px; color:#6b6248; margin-bottom:3px;}
  .dossier .field div.val{ font-size:1rem; line-height:1.5; }
  .typewriter{
    overflow:hidden; white-space:pre-wrap; border-right:2px solid #6b6248;
    animation: blink 0.8s step-end infinite;
  }
  @keyframes blink{ 50%{ border-color:transparent; } }

  /* ---------- Corkboard investigation ---------- */
  .corkboard-wrap{ max-width:1200px; margin:0 auto; }
  .corkboard{
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.03), transparent 40%),
      repeating-radial-gradient(circle at center, var(--cork) 0px, var(--cork) 2px, var(--cork-edge) 3px, var(--cork) 4px);
    border:14px solid #05070c;
    border-radius:10px;
    box-shadow: inset 0 0 60px rgba(0,0,0,0.6), 0 20px 50px rgba(0,0,0,0.5);
    padding:30px;
    position:relative;
    min-height:560px;
  }
  .board-title{
    font-family:var(--font-display); color:var(--paper); font-size:1.4rem;
    margin-bottom:6px; display:flex; align-items:center; gap:10px;
  }
  .board-hint{ color:var(--text-dim); font-size:0.88rem; margin-bottom:22px; }

  .cards-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:26px;
    position:relative;
  }

  .evidence-card{
    background:var(--paper);
    color:var(--ink);
    padding:16px 16px 20px 16px;
    border-radius:2px;
    box-shadow:0 10px 20px rgba(0,0,0,0.45), 0 2px 0 rgba(255,255,255,0.05) inset;
    cursor:grab;
    position:relative;
    transform:rotate(var(--rot,-1deg));
    transition:transform .2s ease, box-shadow .2s ease;
    user-select:none;
    min-height:150px;
  }
  .evidence-card:hover{
    transform:rotate(0deg) translateY(-6px) scale(1.03);
    box-shadow:0 18px 30px rgba(0,0,0,0.6), 0 0 18px var(--accent-glow);
    z-index:5;
  }
  .evidence-card.dragging{ opacity:0.4; }
  .evidence-card.pinned-solved{
    outline:2px solid var(--success);
  }
  .pin{
    position:absolute; top:-10px; left:50%; transform:translateX(-50%);
    width:16px;height:16px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffde8a, var(--pin));
    box-shadow:0 3px 6px rgba(0,0,0,0.5);
  }
  .evidence-card h4{
    margin:6px 0 8px 0; font-size:0.78rem; text-transform:uppercase;
    letter-spacing:1px; color:#6b6248; border-bottom:1px dashed #c9c0a3; padding-bottom:6px;
  }
  .evidence-card .body-text{ font-size:0.92rem; line-height:1.45; white-space:pre-line; }
  .evidence-card.sticky-yellow{ background:var(--sticky1); }
  .evidence-card.sticky-blue{ background:var(--sticky2); }
  .evidence-card.sticky-pink{ background:var(--sticky3); }
  .evidence-card.sticky-green{ background:var(--sticky4); }

  .string{
    position:absolute; height:2px; background:rgba(239,91,91,0.55);
    transform-origin:0 0; pointer-events:none; z-index:1;
    box-shadow:0 0 6px rgba(239,91,91,0.4);
  }

  .examined-badge{
    position:absolute; bottom:8px; right:10px; font-size:0.68rem;
    color:var(--success); font-weight:700; letter-spacing:0.5px;
    opacity:0; transition:opacity .3s;
  }
  .evidence-card.examined .examined-badge{ opacity:1; }

  .metric-mini-grid{ display:grid; grid-template-columns:1fr 1fr; gap:6px 10px; font-size:0.85rem;}
  .metric-mini-grid b{ display:block; font-size:1.05rem; }

  .drop-zone{
    margin-top:30px;
    border:2px dashed rgba(63,169,245,0.4);
    border-radius:10px;
    min-height:110px;
    display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:14px;
    padding:16px;
    background:rgba(63,169,245,0.04);
    transition:all .25s ease;
  }
  .drop-zone.hover{ background:rgba(63,169,245,0.14); border-color:var(--accent); box-shadow:0 0 24px var(--accent-glow) inset; }
  .drop-zone .placeholder{ color:var(--text-dim); font-size:0.9rem; }
  .drop-chip{
    background:var(--paper); color:var(--ink); padding:10px 14px; border-radius:6px;
    font-size:0.85rem; box-shadow:0 6px 14px rgba(0,0,0,0.4);
    display:flex; align-items:center; gap:8px;
    animation:popIn .3s ease;
  }
  @keyframes popIn{ from{ transform:scale(0.5); opacity:0;} to{transform:scale(1); opacity:1;} }
  .drop-chip button{
    background:none;border:none;color:var(--danger);cursor:pointer;font-weight:700;font-size:1rem;
  }

  /* ---------- Chart bars ---------- */
  .chart-block{ margin-top:8px; }
  .bar-row{ display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:0.78rem; }
  .bar-label{ width:70px; flex-shrink:0; color:#6b6248; }
  .bar-track{ flex:1; background:rgba(0,0,0,0.12); border-radius:4px; height:10px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:4px; width:0%; transition:width 1.1s cubic-bezier(.2,.8,.2,1); background:linear-gradient(90deg, var(--accent-dim), var(--accent)); }
  .bar-val{ width:52px; text-align:right; font-weight:700; }

  /* ---------- Modal (magnifier detail) ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(3,6,12,0.78);
    display:none; align-items:center; justify-content:center; z-index:1000;
    backdrop-filter: blur(3px);
    animation:fadeIn .25s ease;
  }
  .modal-backdrop.active{ display:flex; }
  .modal-box{
    background:var(--paper); color:var(--ink); max-width:520px; width:90%;
    padding:30px; border-radius:6px; position:relative;
    box-shadow:0 30px 80px rgba(0,0,0,0.7);
    max-height:80vh; overflow-y:auto;
  }
  .modal-box h3{ font-family:var(--font-display); margin-top:0; }
  .modal-close{
    position:absolute; top:14px; right:16px; background:none; border:none;
    font-size:1.3rem; cursor:pointer; color:#6b6248;
  }

  /* ---------- Solve screen ---------- */
  .solve-wrap{ max-width:820px; margin:0 auto; }
  .options-list{ display:flex; flex-direction:column; gap:14px; margin-top:20px; }
  .option-card{
    background:var(--bg-panel); border:1px solid rgba(255,255,255,0.08);
    padding:18px 20px; border-radius:10px; cursor:pointer;
    transition:all .2s ease; position:relative;
    display:flex; align-items:flex-start; gap:14px;
  }
  .option-card:hover{ border-color:var(--accent); background:#132135; transform:translateX(4px); }
  .option-card.selected{ border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-glow); background:#132a3f; }
  .option-letter{
    width:30px; height:30px; border-radius:50%; background:rgba(63,169,245,0.15);
    border:1px solid var(--accent-dim); display:flex; align-items:center; justify-content:center;
    font-weight:700; color:var(--accent); flex-shrink:0;
  }
  .option-card.correct-flash{ border-color:var(--success); box-shadow:0 0 0 2px rgba(87,214,141,0.5); }
  .option-card.wrong-flash{ border-color:var(--danger); box-shadow:0 0 0 2px rgba(239,91,91,0.5); animation:shake .4s; }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

  .confidence-note{ font-size:0.85rem; color:var(--text-dim); margin-top:18px; }

  /* ---------- Case closed ---------- */
  .closed-wrap{
    min-height:80vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
  }
  .stamp-big{
    font-family:var(--font-display); font-weight:900; font-size:clamp(2.2rem,7vw,4.5rem);
    color:var(--success); border:6px solid var(--success); padding:14px 40px; border-radius:10px;
    transform:rotate(-6deg) scale(0.5); opacity:0;
    letter-spacing:4px;
    animation: stampIn .55s cubic-bezier(.2,1.4,.4,1) .2s forwards;
    box-shadow:0 0 40px rgba(87,214,141,0.35);
  }
  .stamp-big.fail{ color:var(--danger); border-color:var(--danger); box-shadow:0 0 40px rgba(239,91,91,0.35); }
  @keyframes stampIn{ 0%{ opacity:0; transform:rotate(-6deg) scale(2.2);} 60%{opacity:1;} 100%{opacity:1; transform:rotate(-6deg) scale(1);} }

  .confetti{
    position:fixed; top:-10px; width:8px; height:14px; z-index:2000; opacity:0.9;
    animation: fall linear forwards;
  }
  @keyframes fall{ to{ transform:translateY(110vh) rotate(600deg); opacity:0; } }

  .case-summary-line{ margin-top:26px; color:var(--text-soft); font-size:1.05rem; max-width:600px; }

  /* ---------- Learning report ---------- */
  .report-wrap{ max-width:820px; margin:0 auto; }
  .report-card{
    background:var(--bg-panel); border:1px solid rgba(255,255,255,0.08);
    border-radius:12px; padding:26px 28px; margin-bottom:18px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
  }
  .report-card h3{ margin-top:0; color:var(--paper); font-family:var(--font-display); display:flex; align-items:center; gap:8px;}
  .improve-list{ padding-left:20px; }
  .improve-list li{ margin-bottom:8px; line-height:1.5; }
  .score-ring-wrap{ display:flex; align-items:center; gap:22px; flex-wrap:wrap;}
  svg.ring{ transform:rotate(-90deg); }
  .ring-bg{ fill:none; stroke:rgba(255,255,255,0.08); stroke-width:10; }
  .ring-fg{ fill:none; stroke:var(--accent); stroke-width:10; stroke-linecap:round; filter:drop-shadow(0 0 6px var(--accent-glow)); transition:stroke-dashoffset 1.2s ease; }
  .ring-text{ font-size:1.4rem; font-weight:800; fill:var(--paper); transform:rotate(90deg); }

  footer.credit{ text-align:center; color:var(--text-dim); font-size:0.75rem; margin:40px 0 10px; }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--accent-dim); border-radius:4px; }

  @media (max-width:640px){
    .dossier{ padding:24px 20px; }
    .cards-grid{ grid-template-columns:1fr 1fr; }
  }
  @media (max-width:420px){
    .cards-grid{ grid-template-columns:1fr; }
  }

  .theme-grid{ display:flex; gap:16px; flex-wrap:wrap; justify-content:center; margin-bottom:10px; }
  .theme-swatch{
    width:150px; padding:16px; border-radius:12px; cursor:pointer; border:2px solid transparent;
    background:var(--bg-panel); transition:all .2s ease; text-align:left;
  }
  .theme-swatch:hover{ transform:translateY(-4px); }
  .theme-swatch.active{ border-color:var(--accent); box-shadow:0 0 20px var(--accent-glow); }
  .swatch-dots{ display:flex; gap:6px; margin-bottom:10px; }
  .swatch-dots span{ width:20px;height:20px;border-radius:50%; display:inline-block; }
  .theme-name{ font-size:0.85rem; font-weight:600; color:var(--paper); }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  /* ============================================================
     THEMES
  ============================================================ */
  var THEMES = {
    noir: { name:"Noir Blue", accent:"#3fa9f5", accentDim:"#1c5680", glow:"rgba(63,169,245,0.55)", gold:"#e8b34c" },
    claude: { name:"Claude Orange", accent:"#d97a4d", accentDim:"#7a3d24", glow:"rgba(217,122,77,0.55)", gold:"#f0c14b" },
    emerald: { name:"Emerald Files", accent:"#3fd68d", accentDim:"#1a6b45", glow:"rgba(63,214,141,0.5)", gold:"#e8d24c" },
    crimson: { name:"Crimson Case", accent:"#e5556b", accentDim:"#7a2434", glow:"rgba(229,85,107,0.5)", gold:"#e8b34c" }
  };

  function applyTheme(key){
    var t = THEMES[key] || THEMES.noir;
    var r = document.documentElement.style;
    r.setProperty('--accent', t.accent);
    r.setProperty('--accent-dim', t.accentDim);
    r.setProperty('--accent-glow', t.glow);
    r.setProperty('--gold', t.gold);
    r.setProperty('--pin', t.gold);
  }
  // Pre-selected by user: Noir Blue
  var selectedTheme = 'noir';
  applyTheme(selectedTheme);

  /* ============================================================
     CASE DATA — 12 fictional marketing cases
  ============================================================ */
  var CASES = [
    {
      company:"Lumibrew Coffee Co.",
      industry:"Food & Beverage",
      objective:"Drive trial of a new cold-brew line among young professionals.",
      audience:"Urban professionals, 24–35, health-conscious, high mobile usage.",
      channels:["Instagram Ads","Influencer Partnerships","In-store Sampling","Email"],
      budget:{ "Instagram Ads":40, "Influencer":30, "In-store":20, "Email":10 },
      metrics:{ reach:"1.2M", ctr:"0.4%", engagement:"2.1%", conversions:"0.3%", sales:"$18,400" },
      comments:[
        "Saw the ad three times today, still don't know what the actual product tastes like.",
        "The influencer clearly doesn't even drink coffee, felt fake.",
        "Nice photos but I have no idea where to buy this."
      ],
      social:{ instagramGrowth:"+2%", shareOfVoice:"Low", sentiment:"Mixed", commentThemes:"Confusion about product, distrust of influencers" },
      mistake:"The campaign prioritized aesthetic influencer content over clear product information and purchase guidance, leaving customers unaware of what the product was or where to buy it.",
      clues:[
        "CTR is extremely low (0.4%) despite massive reach — the message isn't compelling clicks.",
        "Customer comments repeatedly mention confusion about the product and purchase location.",
        "Influencers chosen had large followings but no authentic connection to coffee culture."
      ],
      explanation:"Lumibrew focused its budget on visually appealing influencer content without ensuring the message clearly communicated the product's value or where to buy it. High reach with low CTR and conversions signals an awareness-conversion mismatch — people saw the brand but weren't moved to act because critical information and credibility were missing.",
      improvements:[
        "Pair influencer content with clear CTAs and retailer locators.",
        "Select micro-influencers with authentic ties to coffee/wellness niches.",
        "Add product-explainer content (taste, ingredients, use-case) before amplifying reach."
      ]
    },
    {
      company:"Vantage Fitness Gear",
      industry:"Sportswear & Equipment",
      objective:"Increase online sales of a new running shoe line during a holiday sale.",
      audience:"Amateur runners, 18–40, price-sensitive, active on social media.",
      channels:["Facebook Ads","Google Search Ads","SMS Marketing","Retargeting"],
      budget:{ "Facebook Ads":35, "Google Search":25, "SMS":15, "Retargeting":25 },
      metrics:{ reach:"860K", ctr:"3.1%", engagement:"4.5%", conversions:"0.8%", sales:"$41,200" },
      comments:[
        "Added to cart but the discount code expired before I could check out.",
        "Checkout page timed out twice during the sale.",
        "Great ad, terrible experience trying to actually buy."
      ],
      social:{ instagramGrowth:"+5%", shareOfVoice:"Medium", sentiment:"Frustrated", commentThemes:"Checkout failures, expired promo codes" },
      mistake:"Strong ad performance drove traffic, but an unoptimized checkout process and mistimed promo codes caused mass cart abandonment during the peak sale window.",
      clues:[
        "CTR (3.1%) and engagement (4.5%) are healthy — the ads worked well.",
        "Conversion rate (0.8%) is far below industry norms despite good traffic quality.",
        "Multiple comments cite technical checkout failures during high-traffic hours."
      ],
      explanation:"The disconnect between strong upper-funnel metrics (CTR, engagement) and weak conversions points to a bottom-funnel failure: the website's checkout system wasn't built to handle the sale's traffic surge, and promo code timing wasn't synced with the campaign schedule, causing abandoned carts at the final step.",
      improvements:[
        "Load-test checkout infrastructure before major sales events.",
        "Sync promo code validity windows precisely with campaign flight dates.",
        "Add cart-abandonment recovery emails/SMS with time-sensitive incentives."
      ]

  var state = {

  function pickRandomCase(){
    var idx = Math.floor(Math.random() * CASES.length);
    return JSON.parse(JSON.stringify(CASES[idx]));
  }

  function resetForNewCase(){
    state.currentCase = pickRandomCase();
    state.examined = {};
    state.boardEvidence = [];
    state.selectedOption = null;
    state.solved = false;
    state.attempted = false;
  }

  /* ============================================================
     RENDER HELPERS
  ============================================================ */
  var root = document.getElementById('app');

  function el(tag, attrs, children){
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function(k){
      if(k === 'class') e.className = attrs[k];
      else if(k === 'html') e.innerHTML = attrs[k];
      else if(k.indexOf('on') === 0 && typeof attrs[k] === 'function') e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function(c){
      if(typeof c === 'string') e.appendChild(document.createTextNode(c));
      else if(c) e.appendChild(c);
    });
    return e;
  }

  function progressBar(step){
    var steps = ['Assignment','Board','Investigate','Solve','Closed','Report'];
    var wrap = el('div', {class:'progress-track'});
    steps.forEach(function(s, i){
      var cls = 'progress-seg';
      if(i < step) cls += ' done';
      else if(i === step) cls += ' current';
      wrap.appendChild(el('div', {class:cls, title:s}));
    });
    return wrap;
  }

  function topbar(caseTagText){
    var bar = el('div', {class:'topbar'}, [
      el('div', {class:'brand'}, [
        el('div', {class:'badge'}, ['🕵️']),
        el('span', {}, ['Marketing Detective'])
      ]),
      caseTagText ? el('div', {class:'case-tag'}, [caseTagText]) : el('div',{},[])
    ]);
    return bar;
  }

    wrap.appendChild(el('div', {class:'subtitle-hero'}, [
      'A campaign has gone wrong. The clues are scattered across the board — reach, clicks, comments, and confessions. Choose your investigation theme, then step into the case file.'
    ]));

    var themeGrid = el('div', {class:'theme-grid'});
    Object.keys(THEMES).forEach(function(key){

        el('div', {class:'swatch-dots'}, [

    return [

      { id:'budget', title:'Budget Allocation', sticky:1 },
      { id:'comments', title:'Customer Comments', sticky:2 },

      { id:'audience', title:'Target Audience Recap', sticky:0 },

  function renderCardBody(id, c){
    if(id === 'metrics'){
      var g = el('div', {class:'metric-mini-grid'});
      var m = c.metrics;
      [['Reach', m.reach],['CTR', m.ctr],['Engagement', m.engagement],['Conversions', m.conversions],['Sales', m.sales]].forEach(function(pair){
        g.appendChild(el('div', {}, [el('b',{},[pair[1]]), pair[0]]));
      });
      return g;
    }
    if(id === 'budget'){
      var chart = el('div', {class:'chart-block'});
      var entries = Object.keys(c.budget);
      entries.forEach(function(k){
        var pct = c.budget[k];
        var row = el('div', {class:'bar-row'}, [
          el('div', {class:'bar-label'}, [k]),
          el('div', {class:'bar-track'}, [el('div', {class:'bar-fill', style:'width:0%', 'data-target':pct})]),
          el('div', {class:'bar-val'}, [pct + '%'])
        ]);
        chart.appendChild(row);
      });
      return chart;
    }
    if(id === 'comments'){
      var list = el('div', {class:'body-text'});
      c.comments.forEach(function(cm, i){
        list.appendChild(el('div', {style:'margin-bottom:8px;'}, ['"' + cm + '"']));
      });
      return list;
    }
    if(id === 'social'){
      var s = c.social;
      var body = el('div', {class:'body-text'});
      Object.keys(s).forEach(function(k){
        var label = k.replace(/([A-Z])/g, ' $1');
        label = label.charAt(0).toUpperCase() + label.slice(1);
        body.appendChild(el('div', {}, [el('b',{},[label + ': ']), s[k]]));
      });
      return body;
    }
    if(id === 'audience'){
      return el('div', {class:'body-text'}, [c.audience]);
    }
    if(id === 'channels'){
      return el('div', {class:'body-text'}, [c.channels.join('\n')]);
    }
    return el('div', {}, ['']);
  }

    defs.forEach(function(def, i){
      var card = el('div', {
        class: 'evidence-card ' + STICKY_CLASSES[def.sticky] + (state.examined[def.id] ? ' examined' : ''),
        style: '--rot:' + ((i % 2 === 0 ? -1 : 1) * (2 + (i % 3))) + 'deg;',
        draggable: 'true',
        'data-id': def.id
      }, [
        el('div', {class:'pin'}),
        el('h4', {}, [def.title]),
        renderCardBody(def.id, c),
        el('div', {class:'examined-badge'}, ['✓ EXAMINED'])
      ]);

      card.addEventListener('click', function(){
        state.examined[def.id] = true;
        card.classList.add('examined');
        openModal(def.title, renderCardBody(def.id, c));
      });

      card.addEventListener('dragstart', function(e){
        card.classList.add('dragging');
        e.dataTransfer.setData('text/plain', def.id);
      });
      card.addEventListener('dragend', function(){
        card.classList.remove('dragging');
      });

      grid.appendChild(card);
    });

    board.appendChild(grid);

    // Drop zone
    var dropZone = el('div', {class:'drop-zone', id:'dropZone'}, [
      el('div', {class:'placeholder', id:'dropPlaceholder'}, ['Drag evidence here to pin it to your theory board...'])
    ]);
    dropZone.addEventListener('dragover', function(e){ e.preventDefault(); dropZone.classList.add('hover'); });
    dropZone.addEventListener('dragleave', function(){ dropZone.classList.remove('hover'); });
    dropZone.addEventListener('drop', function(e){
      e.preventDefault();
      dropZone.classList.remove('hover');
      var id = e.dataTransfer.getData('text/plain');
      if(id && state.boardEvidence.indexOf(id) === -1){
        state.boardEvidence.push(id);
        state.examined[id] = true;
        refreshDropZone(defs, c);
        refreshExaminedBadges();
      }
    });

    board.appendChild(dropZone);
    wrap.appendChild(board);
    screen.appendChild(wrap);

    var btnRow = el('div', {class:'btn-row', style:'justify-content:center; margin-top:26px;'});
    var backBtn = el('button', {class:'btn ghost'}, ['← Back to Dossier']);
    backBtn.addEventListener('click', function(){ state.screen = 'assignment'; render(); });
    var solveBtn = el('button', {class:'btn primary'}, ['🧩 Ready to Solve the Case →']);
    solveBtn.addEventListener('click', function(){ state.screen = 'solve'; render(); });
    btnRow.appendChild(backBtn);
    btnRow.appendChild(solveBtn);
    screen.appendChild(btnRow);

    root.appendChild(screen);

    // animate bars if any budget card exists on screen
    setTimeout(function(){
      document.querySelectorAll('.bar-fill').forEach(function(bar){
        bar.style.width = bar.getAttribute('data-target') + '%';
      });
    }, 120);

    refreshDropZone(defs, c);
  }

  function refreshDropZone(defs, c){
    var dropZone = document.getElementById('dropZone');
    if(!dropZone) return;
    dropZone.innerHTML = '';
    if(state.boardEvidence.length === 0){
      dropZone.appendChild(el('div', {class:'placeholder'}, ['Drag evidence here to pin it to your theory board...']));
      return;
    }
    state.boardEvidence.forEach(function(id){
      var def = defs.filter(function(d){ return d.id === id; })[0];
      if(!def) return;
      var chip = el('div', {class:'drop-chip'}, [
        el('span', {}, ['📎 ' + def.title]),
      ]);
      var removeBtn = el('button', {}, ['×']);
      removeBtn.addEventListener('click', function(){
        state.boardEvidence = state.boardEvidence.filter(function(x){ return x !== id; });
        refreshDropZone(defs, c);
      });
      chip.appendChild(removeBtn);
      dropZone.appendChild(chip);
    });
  }

  function refreshExaminedBadges(){
    document.querySelectorAll('.evidence-card').forEach(function(card){
      var id = card.getAttribute('data-id');
      if(state.examined[id]) card.classList.add('examined');
    });
  }

  /* ---------- Modal ---------- */
  var modalBackdrop = null;
  function ensureModal(){
    if(modalBackdrop) return;
    modalBackdrop = el('div', {class:'modal-backdrop', id:'modalBackdrop'});
    var box = el('div', {class:'modal-box', id:'modalBox'});
    modalBackdrop.appendChild(box);
    modalBackdrop.addEventListener('click', function(e){
      if(e.target === modalBackdrop) closeModal();
    });
    document.body.appendChild(modalBackdrop);
  }
  function openModal(title, contentNode){
    ensureModal();
    var box = document.getElementById('modalBox');
    box.innerHTML = '';
    var closeBtn = el('button', {class:'modal-close'}, ['✕']);
    closeBtn.addEventListener('click', closeModal);
    box.appendChild(closeBtn);
    box.appendChild(el('h3', {}, ['🔎 ' + title]));
    box.appendChild(contentNode);
    modalBackdrop.classList.add('active');
    setTimeout(function(){
      document.querySelectorAll('#modalBox .bar-fill').forEach(function(bar){
        bar.style.width = bar.getAttribute('data-target') + '%';
      });
    }, 80);
  }
  function closeModal(){
    if(modalBackdrop) modalBackdrop.classList.remove('active');
  }

  /* ============================================================
     SCREEN: SOLVE THE CASE
  ============================================================ */
  function buildOptions(c){
    // correct answer + 3 plausible distractors pulled from other cases' mistakes
    var others = CASES.filter(function(x){ return x.company !== c.company; });
    shuffleArray(others);
    var distractors = others.slice(0, 3).map(function(o){ return o.mistake; });
    var options = distractors.concat([c.mistake]);
    shuffleArray(options);
    return options;
  }
  function shuffleArray(arr){
    for(var i = arr.length -1; i>0; i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp = arr[i]; arr[i]=arr[j]; arr[j]=tmp;
    }
  }

  var currentOptions = null;

  function renderSolve(){
    clearRoot();
    var c = state.currentCase;
    if(!currentOptions) currentOptions = buildOptions(c);

    var screen = el('div', {class:'screen active'});
    screen.appendChild(topbar('CASE FILE // ' + c.company.toUpperCase()));
    screen.appendChild(progressBar(3));

    var wrap = el('div', {class:'solve-wrap'});
    wrap.appendChild(el('div', {class:'board-title'}, ['🧠 Solve the Case']));
    wrap.appendChild(el('div', {class:'board-hint'}, [
      'Based on the evidence, what was the primary marketing mistake behind ' + c.company + '\u2019s underperformance?'
    ]));

    var optionsList = el('div', {class:'options-list', id:'optionsList'});
    var letters = ['A','B','C','D'];
    currentOptions.forEach(function(opt, i){
      var card = el('div', {class:'option-card', 'data-index': i}, [
        el('div', {class:'option-letter'}, [letters[i]]),
        el('div', {}, [opt])
      ]);
      card.addEventListener('click', function(){
        if(state.attempted) return;
        document.querySelectorAll('.option-card').forEach(function(oc){ oc.classList.remove('selected'); });
        card.classList.add('selected');
        state.selectedOption = i;
        confirmBtn.disabled = false;
      });
      optionsList.appendChild(card);
    });
    wrap.appendChild(optionsList);

    wrap.appendChild(el('div', {class:'confidence-note'}, [
      'Tip: Revisit clues on the board before locking in your answer — the evidence never lies.'
    ]));

    var btnRow = el('div', {class:'btn-row', style:'margin-top:22px;'});
    var backBtn = el('button', {class:'btn ghost'}, ['← Back to Board']);
    backBtn.addEventListener('click', function(){ state.screen = 'board'; render(); });
    var confirmBtn = el('button', {class:'btn primary'}, ['🔒 Lock In Answer']);
    confirmBtn.disabled = (state.selectedOption === null);
    confirmBtn.addEventListener('click', function(){
      if(state.selectedOption === null) return;
      state.attempted = true;
      var chosen = currentOptions[state.selectedOption];
      var isCorrect = chosen === c.mistake;
      state.solved = isCorrect;

      document.querySelectorAll('.option-card').forEach(function(oc, i){
        if(currentOptions[i] === c.mistake) oc.classList.add('correct-flash');
        else if(i === state.selectedOption && !isCorrect) oc.classList.add('wrong-flash');
      });
      confirmBtn.disabled = true;

      setTimeout(function(){
        state.screen = 'closed';
        render();
      }, isCorrect ? 1100 : 1600);
    });
    btnRow.appendChild(backBtn);
    btnRow.appendChild(confirmBtn);
    wrap.appendChild(btnRow);

    screen.appendChild(wrap);
    root.appendChild(screen);
  }

  /* ============================================================
     SCREEN: CASE CLOSED
  ============================================================ */
  function renderClosed(){
    clearRoot();
    var c = state.currentCase;
    var screen = el('div', {class:'screen active'});
    screen.appendChild(topbar('CASE FILE // ' + c.company.toUpperCase()));
    screen.appendChild(progressBar(4));

    var wrap = el('div', {class:'closed-wrap'});
    var stampText = state.solved ? 'CASE CLOSED' : 'CASE REOPENED';
    var stamp = el('div', {class:'stamp-big' + (state.solved ? '' : ' fail')}, [stampText]);
    wrap.appendChild(stamp);

    wrap.appendChild(el('div', {class:'case-summary-line'}, [
      state.solved
        ? 'Sharp instincts, detective. You correctly identified the root cause behind ' + c.company + '\u2019s underperformance.'
        : 'Not quite \u2014 the real culprit was something else entirely. Every great detective misses a clue now and then. Let\u2019s review the full findings.'
    ]));

    var btnRow = el('div', {class:'btn-row', style:'margin-top:30px;'});
    var reportBtn = el('button', {class:'btn primary'}, ['📋 View Learning Report →']);
    reportBtn.addEventListener('click', function(){ state.screen = 'report'; render(); });
    btnRow.appendChild(reportBtn);
    wrap.appendChild(btnRow);

    screen.appendChild(wrap);
    root.appendChild(screen);

    if(state.solved){
      spawnConfetti();
    }
  }

  function spawnConfetti(){
    var colors = ['#3fa9f5','#e8b34c','#57d68d','#e5556b','#ffffff'];
    for(var i=0;i<50;i++){
      (function(){
        var c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random()*100 + 'vw';
        c.style.background = colors[Math.floor(Math.random()*colors.length)];
        c.style.animationDuration = (2.5 + Math.random()*2) + 's';
        c.style.animationDelay = (Math.random()*0.6) + 's';
        document.body.appendChild(c);
        setTimeout(function(){ c.remove(); }, 5200);
      })();
    }
  }

  /* ============================================================
     SCREEN: LEARNING REPORT
  ============================================================ */
  function renderReport(){
    clearRoot();
    var c = state.currentCase;
    var screen = el('div', {class:'screen active'});
    screen.appendChild(topbar('CASE FILE // ' + c.company.toUpperCase()));
    screen.appendChild(progressBar(5));

    var wrap = el('div', {class:'report-wrap'});
    wrap.appendChild(el('div', {class:'board-title'}, ['📋 Learning Report: ' + c.company]));

    var scorePct = state.solved ? 100 : 40;
    var circumference = 2 * Math.PI * 45;
    var offset = circumference - (scorePct/100)*circumference;

    var scoreCard = el('div', {class:'report-card'}, [
      el('div', {class:'score-ring-wrap'}, [
        (function(){
          var svgNS = "http://www.w3.org/2000/svg";
          var svg = document.createElementNS(svgNS, 'svg');
          svg.setAttribute('width','110'); svg.setAttribute('height','110'); svg.setAttribute('class','ring');
          svg.setAttribute('viewBox','0 0 110 110');
          var bg = document.createElementNS(svgNS,'circle');
          bg.setAttribute('cx','55'); bg.setAttribute('cy','55'); bg.setAttribute('r','45'); bg.setAttribute('class','ring-bg');
          var fg = document.createElementNS(svgNS,'circle');
          fg.setAttribute('cx','55'); fg.setAttribute('cy','55'); fg.setAttribute('r','45'); fg.setAttribute('class','ring-fg');
          fg.setAttribute('stroke-dasharray', circumference);
          fg.setAttribute('stroke-dashoffset', circumference);
          svg.appendChild(bg); svg.appendChild(fg);
          var txt = document.createElementNS(svgNS,'text');
          txt.setAttribute('x','55'); txt.setAttribute('y','62'); txt.setAttribute('text-anchor','middle');
          txt.setAttribute('class','ring-text');
          txt.textContent = scorePct + '%';
          svg.appendChild(txt);
          setTimeout(function(){ fg.setAttribute('stroke-dashoffset', offset); }, 150);
          return svg;
        })(),
        el('div', {}, [
          el('div', {style:'font-size:1.1rem;color:var(--paper);font-weight:700;margin-bottom:6px;'}, [
            state.solved ? 'Deduction Accuracy: Excellent' : 'Deduction Accuracy: Needs Review'
          ]),
          el('div', {style:'color:var(--text-dim);font-size:0.9rem;'}, [
            'Evidence examined: ' + Object.keys(state.examined).length + ' / 6 items'
          ])
        ])
      ])
    ]);
    wrap.appendChild(scoreCard);

    wrap.appendChild(el('div', {class:'report-card'}, [
      el('h3', {}, ['🎯 The Real Explanation']),
      el('p', {style:'line-height:1.6;'}, [c.explanation])
    ]));

    var cluesList = el('ul', {class:'improve-list'});
    c.clues.forEach(function(clue){ cluesList.appendChild(el('li', {}, [clue])); });
    wrap.appendChild(el('div', {class:'report-card'}, [
      el('h3', {}, ['🧩 Supporting Clues']),
      cluesList
    ]));

    var improveList = el('ul', {class:'improve-list'});
    c.improvements.forEach(function(imp){ improveList.appendChild(el('li', {}, [imp])); });
    wrap.appendChild(el('div', {class:'report-card'}, [
      el('h3', {}, ['💡 Suggested Improvements']),
      improveList
    ]));

    var btnRow = el('div', {class:'btn-row', style:'justify-content:center;margin:30px 0;'});
    var newCaseBtn = el('button', {class:'btn primary'}, ['🗂️ Take a New Case']);
    newCaseBtn.addEventListener('click', function(){
      currentOptions = null;
      resetForNewCase();
      state.screen = 'assignment';
      render();
    });
    var homeBtn = el('button', {class:'btn ghost'}, ['🏠 Change Theme / Home']);
    homeBtn.addEventListener('click', function(){
      currentOptions = null;
      state.screen = 'welcome';
      render();
    });
    btnRow.appendChild(newCaseBtn);
    btnRow.appendChild(homeBtn);
    wrap.appendChild(btnRow);

    wrap.appendChild(el('footer', {class:'credit'}, ['Marketing Detective — a case-based marketing analytics trainer.']));

    screen.appendChild(wrap);
    root.appendChild(screen);
  }

  /* ============================================================
     ROUTER
  ============================================================ */
  function render(){
    closeModal();
    switch(state.screen){
      case 'welcome': renderWelcome(); break;
      case 'assignment': renderAssignment(); break;
      case 'board': renderBoard(); break;
      case 'solve': renderSolve(); break;
      case 'closed': renderClosed(); break;
      case 'report': renderReport(); break;
      default: renderWelcome();
    }
  }

  render();

})();
</script>
</body>
</html>
