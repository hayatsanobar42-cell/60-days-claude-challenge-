  takeaways:   { speaker: "rahul", text: "Here's what I'd want every patient to know before they go through this." },
  system:      { speaker: "priya", text: "Let me walk you through how health system operations teams look at exactly this kind of case." },
  // Scene 8
  restart:     { speaker: "priya", text: "Restarting from the beginning. Every time through, something new stands out." },
  summary:     { speaker: "priya", text: "Here's the full Prior Authorization flow from start to finish: Doctor prescribes → Provider submits PA → Payer reviews → Decision (Approve / Pend / Deny) → If denied: Appeal → If appealed: overturn or uphold → Authorization saved on file. Each step has timelines, rights, and documentation requirements." },
};

/* ─────────────────────────────────────────────────────────
   GAME STATE
   ───────────────────────────────────────────────────────── */
let state = {
  sceneIdx: 0,
  beatIdx:  0,
  beatTimer: null,
  choicesMade: 0,
  running: false,
};

const BEAT_DELAY   = 620;   // ms between beats
const CHOICE_DELAY = 320;   // ms after last beat before choices appear

/* ─────────────────────────────────────────────────────────
   DOM HELPERS — createElement only, never innerHTML on feed
   ───────────────────────────────────────────────────────── */
function qs(sel) { return document.querySelector(sel); }

// Scroll chat to bottom
function scrollFeed() {
  const feed = qs('#chat-feed');
  feed.scrollTop = feed.scrollHeight;
}

// Add a chat bubble (Rahul = left, Priya = right)
function appendBubble(speaker, text, infoText) {
  const feed = qs('#chat-feed');
  const isRahul = speaker === 'rahul';

  // Outer row
  const row = document.createElement('div');
  row.className = `flex ${isRahul ? 'justify-start' : 'justify-end'} gap-2 bubble-enter`;

  // Avatar
  const avatar = document.createElement('div');
  avatar.className = 'flex-shrink-0 text-2xl leading-none select-none';
  avatar.textContent = isRahul ? '👦' : '👧';
  avatar.setAttribute('aria-hidden', 'true');

  // Bubble column (bubble + optional info card)
  const col = document.createElement('div');
  col.className = `flex flex-col max-w-[75%] ${isRahul ? 'items-start' : 'items-end'}`;

  // Name label
  const name = document.createElement('div');
  name.className = `text-[10px] font-semibold mb-1 ${isRahul ? 'text-sky-700 pl-1' : 'text-teal-600 pr-1'}`;
  name.textContent = isRahul ? 'Rahul' : 'Priya';

  // Bubble
  const bubble = document.createElement('div');
  bubble.className = [
    'rounded-2xl px-4 py-2.5 text-sm leading-relaxed shadow-sm',
    isRahul
      ? 'bg-sky-100 text-sky-900 rounded-tl-sm border border-sky-200'
      : 'bg-teal-50 text-teal-900 rounded-tr-sm border border-teal-100'
  ].join(' ');
  bubble.textContent = text;

  col.appendChild(name);
  col.appendChild(bubble);

  // Optional info card
  if (infoText) {
    const card = document.createElement('div');
    card.className = [
      'info-card mt-2 text-xs',
      isRahul ? 'bg-sky-50/80 border-sky-200 text-sky-800' : 'bg-teal-50/80 border-teal-200 text-teal-800'
    ].join(' ');
    card.style.cssText = 'background:rgba(240,247,255,0.7);border-radius:10px;padding:9px 13px;margin-top:7px;font-size:0.78rem;line-height:1.6;border:1px solid rgba(180,218,255,0.6);';
    if (!isRahul) card.style.background = 'rgba(239,250,247,0.75)';
    card.textContent = infoText;
    col.appendChild(card);
  }

  if (isRahul) {
    row.appendChild(avatar);
    row.appendChild(col);
  } else {
    row.appendChild(col);
    row.appendChild(avatar);
  }

  feed.appendChild(row);
  scrollFeed();
  return row;
}

// Add a narrator line (centered italic)
function appendNarrator(text) {
  const feed = qs('#chat-feed');
  const el = document.createElement('div');
  el.className = 'narrator-enter flex justify-center';

  const inner = document.createElement('p');
  inner.className = 'text-center italic text-gray-500 text-xs max-w-[85%] leading-relaxed py-0.5';
  inner.textContent = text;

  el.appendChild(inner);
  feed.appendChild(el);
  scrollFeed();
  return el;
}

// Add a choice button
function appendChoiceButton(label, onClick) {
  const area = qs('#choice-area');
  const btn = document.createElement('button');
  btn.className = [
    'choice-btn choice-enter w-full text-left rounded-xl px-4 py-3',
    'bg-white border border-sky-200 hover:border-sky-400 hover:bg-sky-50',
    'text-sm text-sky-800 font-medium shadow-sm transition-all duration-150',
    'focus:outline-none focus:ring-2 focus:ring-sky-400'
  ].join(' ');
  btn.textContent = label;
  btn.addEventListener('click', onClick);
  area.appendChild(btn);
  return btn;
}

// Disable all choice buttons (after one is selected)
function disableChoices() {
  qs('#choice-area').querySelectorAll('.choice-btn').forEach(b => {
    b.disabled = true;
  });
}

// Clear choice area
function clearChoices() {
  qs('#choice-area').innerHTML = '';
}

/* ─────────────────────────────────────────────────────────
   PROGRESS BAR & SCENE LABEL
   ───────────────────────────────────────────────────────── */
function buildStepLabels() {
  const container = qs('#scene-steps');
  container.innerHTML = '';
  STEP_LABELS.forEach((label, i) => {
    const span = document.createElement('span');
    span.id = `step-${i}`;
    span.className = `whitespace-nowrap transition-colors duration-300 ${i === 0 ? 'text-white font-bold' : 'text-sky-300'}`;
    span.textContent = (i + 1) + '. ' + label;
    container.appendChild(span);
  });
}

function updateProgress(sceneIdx) {
  const pct = Math.round(((sceneIdx + 1) / SCENES.length) * 100);
  qs('#progress-fill').style.width = pct + '%';
  qs('#scene-label').textContent = `Scene ${sceneIdx + 1} / ${SCENES.length}`;

  STEP_LABELS.forEach((_, i) => {
    const el = qs(`#step-${i}`);
    if (!el) return;
    if (i < sceneIdx) { el.className = 'whitespace-nowrap text-sky-300 line-through'; }
    else if (i === sceneIdx) { el.className = 'whitespace-nowrap text-white font-bold'; }
    else { el.className = 'whitespace-nowrap text-sky-300/60'; }
  });
}

/* ─────────────────────────────────────────────────────────
   BEAT RUNNER — plays beats one by one with delays
   ───────────────────────────────────────────────────────── */
function playBeats(scene, onComplete) {
  let i = 0;
  function next() {
    if (i >= scene.beats.length) {
      // All beats done — show choices after a short pause
      setTimeout(onComplete, CHOICE_DELAY);
      return;
    }
    const beat = scene.beats[i++];
    if (beat.type === 'narrator') {
      appendNarrator(beat.text);
    } else {
      appendBubble(beat.type, beat.text, beat.info || null);
    }
    state.beatTimer = setTimeout(next, BEAT_DELAY);
  }
  next();
}

/* ─────────────────────────────────────────────────────────
   SCENE RUNNER
   ───────────────────────────────────────────────────────── */
function runScene(idx) {
  if (idx >= SCENES.length) return;
  state.sceneIdx = idx;
  state.running = true;
  updateProgress(idx);

  const scene = SCENES[idx];

  // Scene separator
  appendNarrator(`— Scene ${idx + 1}: ${scene.title} —`);

  clearChoices();

  playBeats(scene, () => {
    // Show choices
    scene.choices.forEach((choice, ci) => {
      appendChoiceButton(choice.label, () => handleChoice(choice, idx, ci));
    });
  });
}

/* ─────────────────────────────────────────────────────────
   CHOICE HANDLER
   ───────────────────────────────────────────────────────── */
function handleChoice(choice, sceneIdx, choiceIdx) {
  disableChoices();
  state.choicesMade++;

  // Special: restart
  if (choice.effect === 'restart') {
    setTimeout(restartSim, 600);
    return;
  }

  // Show the choice response bubble
  const resp = CHOICE_RESPONSES[choice.effect];
  if (resp) {
    setTimeout(() => {
      appendBubble(resp.speaker, resp.text);
      // Advance to next scene after a moment
      setTimeout(() => advanceScene(sceneIdx), BEAT_DELAY * 2.2);
    }, 350);
  } else {
    setTimeout(() => advanceScene(sceneIdx), 500);
  }
}

function advanceScene(currentIdx) {
  clearChoices();
  const nextIdx = currentIdx + 1;
  if (nextIdx < SCENES.length) {
    runScene(nextIdx);
  } else {
    appendNarrator('— End of Simulation —');
    appendNarrator('You\'ve completed the full Prior Authorization journey. Use the Restart button to explore different choices.');
  }
}

/* ─────────────────────────────────────────────────────────
   RESTART
   ───────────────────────────────────────────────────────── */
function restartSim() {
  clearTimeout(state.beatTimer);
  state = { sceneIdx: 0, beatIdx: 0, beatTimer: null, choicesMade: 0, running: false };
  qs('#chat-feed').innerHTML = '';
  clearChoices();
  updateProgress(0);
  runScene(0);
}

/* ─────────────────────────────────────────────────────────
   BOOT
   ───────────────────────────────────────────────────────── */
buildStepLabels();
runScene(0);
</script>
</body>
