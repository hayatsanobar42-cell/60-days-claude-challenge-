<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Face Puzzle Game</title>
<style>
  :root{
    --bg1:#1e1b3a;
    --bg2:#3a1b5c;
    --accent:#ff6fb0;
    --accent2:#7c5cff;
    --good:#34d399;
    --card:#241f3d;
    --text:#f3f0ff;
    --muted:#a89fc9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
    background:radial-gradient(circle at 20% 0%, var(--bg2), var(--bg1) 60%);
    color:var(--text);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:16px;
    overflow-x:hidden;
  }
  h1{
    margin:8px 0 4px;
    font-size:1.8rem;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-align:center;
    letter-spacing:0.5px;
  }
  .subtitle{
    color:var(--muted);
    margin-bottom:18px;
    text-align:center;
    font-size:0.95rem;
  }
  .panel{
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:18px;
    padding:20px;
    width:100%;
    max-width:560px;
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
    backdrop-filter:blur(6px);
    margin-bottom:20px;
    animation:fadeIn .4s ease;
  }
  @keyframes fadeIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  .hidden{display:none !important;}

  /* CAMERA */
  #cameraWrap{
    position:relative;
    width:100%;
    border-radius:14px;
    overflow:hidden;
    background:#000;
    aspect-ratio:4/3;
  }
  #video{
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scaleX(-1);
    display:block;
  }
  #faceGuide{
    position:absolute;
    top:50%;left:50%;
    width:55%;
    height:75%;
    transform:translate(-50%,-50%);
    border:3px dashed rgba(255,255,255,0.55);
    border-radius:50%;
    pointer-events:none;
  }
  .camera-msg{
    padding:30px 16px;
    text-align:center;
    color:var(--muted);
    line-height:1.5;
  }
  .camera-msg b{color:var(--accent);}

  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:12px;
    padding:12px 20px;
    font-size:0.95rem;
    font-weight:600;
    color:#fff;
    background:linear-gradient(135deg,var(--accent2),var(--accent));
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    box-shadow:0 4px 14px rgba(124,92,255,0.35);
  }
  button:hover{transform:translateY(-2px); box-shadow:0 8px 20px rgba(124,92,255,0.45);}
  button:active{transform:translateY(0); box-shadow:0 2px 8px rgba(124,92,255,0.35);}
  button:disabled{opacity:0.45; cursor:not-allowed; transform:none; box-shadow:none;}
  button.secondary{
    background:rgba(255,255,255,0.08);
    box-shadow:none;
  }
  button.secondary:hover{background:rgba(255,255,255,0.14);}

  .btn-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
    margin-top:16px;
  }

  /* DIFFICULTY */
  .diff-row{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-top:16px;
    flex-wrap:wrap;
  }
  .diff-btn{
    background:rgba(255,255,255,0.06);
    border:2px solid transparent;
    color:var(--text);
    box-shadow:none;
    min-width:110px;
  }
  .diff-btn.selected{
    border-color:var(--accent);
    background:rgba(255,111,176,0.15);
  }
  .diff-btn small{display:block; color:var(--muted); font-weight:400; margin-top:2px;}

  #snapshotPreview{
    width:100%;
    border-radius:14px;
    display:block;
  }

  /* GAME HUD */
  #hud{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    width:100%;
    max-width:560px;
    margin-bottom:14px;
  }
  .stat{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:12px;
    padding:8px 14px;
    text-align:center;
    min-width:84px;
  }
  .stat .val{font-size:1.15rem; font-weight:700; color:var(--accent);}
  .stat .lbl{font-size:0.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px;}

  /* PUZZLE BOARD */
  #boardWrap{
    position:relative;
    width:100%;
    max-width:560px;
    aspect-ratio:1/1;
    margin:0 auto;
    border-radius:14px;
    overflow:hidden;
    background:#0c0a1a;
    box-shadow:0 10px 30px rgba(0,0,0,0.45), inset 0 0 0 2px rgba(255,255,255,0.06);
    touch-action:none;
    user-select:none;
  }
  .cell-bg{
    position:absolute;
    box-sizing:border-box;
    border:1px solid rgba(255,255,255,0.05);
  }
  .piece{
    position:absolute;
    box-sizing:border-box;
    background-repeat:no-repeat;
    border:2px solid rgba(255,255,255,0.18);
    border-radius:4px;
    cursor:grab;
    transition:left .18s ease, top .18s ease, box-shadow .15s ease, border-color .15s ease, transform .1s ease;
    will-change:left, top;
    background-color:#1a1530;
  }
  .piece.dragging{
    cursor:grabbing;
    z-index:50;
    border-color:#ffd166 !important;
    box-shadow:0 8px 24px rgba(0,0,0,0.6);
    transition:none;
    transform:scale(1.04);
  }
  .piece.correct{
    border-color:var(--good) !important;
    box-shadow:0 0 0 2px rgba(52,211,153,0.35);
  }
  .piece:active{cursor:grabbing;}

  /* RESULTS OVERLAY */
  #resultsOverlay{
    position:fixed;
    inset:0;
    background:rgba(10,8,20,0.82);
    backdrop-filter:blur(6px);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:200;
    padding:16px;
    animation:fadeIn .3s ease;
  }
  .results-card{
    background:var(--card);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:20px;
    padding:28px 24px;
    max-width:420px;
    width:100%;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
  }
  .results-card h2{
    margin:0 0 6px;
    font-size:1.6rem;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .results-stats{
    display:flex;
    justify-content:center;
    gap:14px;
    margin:18px 0;
    flex-wrap:wrap;
  }
  .results-stats .stat{min-width:90px;}
  #newBestBadge{
    display:inline-block;
    background:linear-gradient(135deg,#ffd166,#ff6fb0);
    color:#3a1b00;
    font-weight:700;
    padding:6px 14px;
    border-radius:999px;
    font-size:0.85rem;
    margin-bottom:10px;
  }

  /* LEADERBOARD */
  #leaderboard{
    width:100%;
    max-width:560px;
  }
  #leaderboard h3{
    margin:0 0 10px;
    font-size:1rem;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:1px;
  }
  table.lb{
    width:100%;
    border-collapse:collapse;
    font-size:0.88rem;
  }
  table.lb th, table.lb td{
    padding:8px 6px;
    text-align:left;
    border-bottom:1px solid rgba(255,255,255,0.07);
  }
  table.lb th{color:var(--muted); font-weight:600; font-size:0.75rem; text-transform:uppercase;}
  table.lb tr:last-child td{border-bottom:none;}
  .diff-tag{
    display:inline-block;
    padding:2px 8px;
    border-radius:999px;
    font-size:0.72rem;
    font-weight:600;
  }
  .diff-tag.easy{background:rgba(52,211,153,0.18); color:#34d399;}
  .diff-tag.medium{background:rgba(255,209,102,0.18); color:#ffd166;}
  .diff-tag.hard{background:rgba(255,111,176,0.18); color:#ff6fb0;}
  .empty-lb{color:var(--muted); font-size:0.88rem; padding:10px 0;}

  canvas{display:none;}

  @media (max-width:480px){
    h1{font-size:1.4rem;}
    .panel{padding:14px; border-radius:14px;}
    .stat{min-width:70px; padding:6px 10px;}
    .stat .val{font-size:1rem;}
  }
</style>
</head>
<body>

<h1>🧩 Face Puzzle Game</h1>
<div class="subtitle">Snap a selfie, scramble it, and race to solve your own face.</div>

<!-- STEP 1: CAMERA -->
<div class="panel" id="cameraPanel">
  <div id="cameraWrap">
    <video id="video" autoplay playsinline muted></video>
    <div id="faceGuide"></div>
    <div class="camera-msg hidden" id="cameraError"></div>
  </div>
  <div class="btn-row">
    <button id="startCameraBtn">📷 Enable Camera</button>
    <button id="takePhotoBtn" class="hidden">📸 Take Photo</button>
  </div>
</div>

<!-- STEP 2: PREVIEW + DIFFICULTY -->
<div class="panel hidden" id="previewPanel">
  <canvas id="snapCanvas"></canvas>
  <img id="snapshotPreview" alt="Captured face"/>
  <div class="diff-row">
    <button class="diff-btn" data-size="3">Easy<small>3 × 3</small></button>
    <button class="diff-btn" data-size="4">Medium<small>4 × 4</small></button>
    <button class="diff-btn" data-size="5">Hard<small>5 × 5</small></button>
  </div>
  <div class="btn-row">
    <button class="secondary" id="retakeBtn">🔄 Retake Photo</button>
    <button id="startPuzzleBtn" disabled>▶ Start Puzzle</button>
  </div>
</div>

<!-- STEP 3: GAME -->
<div class="hidden" id="gamePanel" style="width:100%; max-width:560px; display:flex; flex-direction:column; align-items:center;">
  <div id="hud">
    <div class="stat"><div class="val" id="timerVal">00:00.0</div><div class="lbl">Time</div></div>
    <div class="stat"><div class="val" id="movesVal">0</div><div class="lbl">Moves</div></div>
    <div class="stat"><div class="val" id="correctVal">0/9</div><div class="lbl">Placed</div></div>
  </div>
  <div id="boardWrap"></div>
  <div class="btn-row">
    <button class="secondary" id="newPhotoBtn">🆕 New Photo</button>
    <button class="secondary" id="restartBtn">🔁 Restart Puzzle</button>
  </div>
</div>

<!-- LEADERBOARD -->
<div class="panel" id="leaderboard">
  <h3>🏆 Best Times</h3>
  <div id="lbContent"></div>
</div>

<!-- RESULTS OVERLAY -->
<div id="resultsOverlay" class="hidden">
  <div class="results-card">
    <div id="newBestBadge" class="hidden">🎉 New Best Time!</div>
    <h2>Puzzle Solved!</h2>
    <div class="subtitle" id="resultsSub">Nicely done.</div>
    <div class="results-stats">
      <div class="stat"><div class="val" id="resTime">00:00.0</div><div class="lbl">Time</div></div>
      <div class="stat"><div class="val" id="resMoves">0</div><div class="lbl">Moves</div></div>
      <div class="stat"><div class="val" id="resDiff">3×3</div><div class="lbl">Difficulty</div></div>
    </div>
    <div class="btn-row">
      <button class="secondary" id="resultsNewPhotoBtn">🆕 New Photo</button>
      <button id="resultsPlayAgainBtn">▶ Play Again</button>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  /* ---------- STATE ---------- */
  let stream = null;
  let capturedImage = null;   // HTMLImageElement of the snapshot
  let gridSize = 3;
  let pieces = [];            // {correctIndex, currentIndex, el, x, y}
  let cellSize = 0;
  let boardPx = 0;
  let moves = 0;
  let startTime = null;
  let timerInterval = null;
  let elapsedMs = 0;
  let gameWon = false;
  let dragState = null;

  /* ---------- ELEMENTS ---------- */
  const video = document.getElementById('video');
  const cameraPanel = document.getElementById('cameraPanel');
  const cameraError = document.getElementById('cameraError');
  const startCameraBtn = document.getElementById('startCameraBtn');
  const takePhotoBtn = document.getElementById('takePhotoBtn');

  const previewPanel = document.getElementById('previewPanel');
  const snapCanvas = document.getElementById('snapCanvas');
  const snapshotPreview = document.getElementById('snapshotPreview');
  const retakeBtn = document.getElementById('retakeBtn');
  const startPuzzleBtn = document.getElementById('startPuzzleBtn');
  const diffBtns = document.querySelectorAll('.diff-btn');

  const gamePanel = document.getElementById('gamePanel');
  const boardWrap = document.getElementById('boardWrap');
  const timerVal = document.getElementById('timerVal');
  const movesVal = document.getElementById('movesVal');
  const correctVal = document.getElementById('correctVal');
  const newPhotoBtn = document.getElementById('newPhotoBtn');
  const restartBtn = document.getElementById('restartBtn');

  const resultsOverlay = document.getElementById('resultsOverlay');
  const resTime = document.getElementById('resTime');
  const resMoves = document.getElementById('resMoves');
  const resDiff = document.getElementById('resDiff');
  const resultsSub = document.getElementById('resultsSub');
  const newBestBadge = document.getElementById('newBestBadge');
  const resultsNewPhotoBtn = document.getElementById('resultsNewPhotoBtn');
  const resultsPlayAgainBtn = document.getElementById('resultsPlayAgainBtn');

  const lbContent = document.getElementById('lbContent');

  /* ============================================================
     CAMERA
  ============================================================ */
  async function startCamera(){
    cameraError.classList.add('hidden');
    cameraError.innerHTML = '';
    startCameraBtn.disabled = true;
    startCameraBtn.textContent = 'Requesting camera…';
    try{
      stream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:'user', width:{ideal:960}, height:{ideal:720} },
        audio:false
      });
      video.srcObject = stream;
      await video.play().catch(()=>{});
      startCameraBtn.classList.add('hidden');
      takePhotoBtn.classList.remove('hidden');
    }catch(err){
      let msg;
      if(err && (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError')){
        msg = '<b>Camera permission denied.</b><br>Please allow camera access in your browser settings and reload the page to play.';
      } else if(err && (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError')){
        msg = '<b>No camera found.</b><br>Connect a webcam or use a device with a front-facing camera.';
      } else if(location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1'){
        msg = '<b>Camera requires HTTPS.</b><br>Please load this page over HTTPS or on localhost.';
      } else {
        msg = '<b>Could not access camera.</b><br>' + (err && err.message ? err.message : 'Unknown error.');
      }
      cameraError.innerHTML = msg;
      cameraError.classList.remove('hidden');
      startCameraBtn.disabled = false;
      startCameraBtn.textContent = '📷 Try Again';
    }
  }

  function stopCamera(){
    if(stream){
      stream.getTracks().forEach(t=>t.stop());
      stream = null;
    }
  }

  takePhotoBtn.addEventListener('click', ()=>{
    const vw = video.videoWidth || 640;
    const vh = video.videoHeight || 480;
    const size = Math.min(vw, vh); // square crop
    const sx = (vw - size)/2;
    const sy = (vh - size)/2;

    snapCanvas.width = 720;
    snapCanvas.height = 720;
    const ctx = snapCanvas.getContext('2d');
    ctx.save();
    // mirror to match preview (selfie view)
    ctx.translate(snapCanvas.width, 0);
    ctx.scale(-1,1);
    ctx.drawImage(video, sx, sy, size, size, 0, 0, snapCanvas.width, snapCanvas.height);
    ctx.restore();

    const dataUrl = snapCanvas.toDataURL('image/png');
    snapshotPreview.src = dataUrl;

    capturedImage = new Image();
    capturedImage.onload = ()=>{
      cameraPanel.classList.add('hidden');
      previewPanel.classList.remove('hidden');
      stopCamera();
    };
    capturedImage.src = dataUrl;
  });

  startCameraBtn.addEventListener('click', startCamera);
  // auto-start camera on load
  window.addEventListener('load', startCamera);

  /* ============================================================
     DIFFICULTY SELECTION
  ============================================================ */
  diffBtns.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      diffBtns.forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      gridSize = parseInt(btn.dataset.size, 10);
      startPuzzleBtn.disabled = false;
    });
  });

  retakeBtn.addEventListener('click', ()=>{
    previewPanel.classList.add('hidden');
    cameraPanel.classList.remove('hidden');
    cameraError.classList.add('hidden');
    startCameraBtn.classList.remove('hidden');
    takePhotoBtn.classList.add('hidden');
    startCameraBtn.disabled = false;
    startCameraBtn.textContent = '📷 Enable Camera';
    startCamera();
  });

  startPuzzleBtn.addEventListener('click', ()=>{
    previewPanel.classList.add('hidden');
    gamePanel.classList.remove('hidden');
    buildPuzzle();
  });

  newPhotoBtn.addEventListener('click', goToNewPhoto);
  resultsNewPhotoBtn.addEventListener('click', ()=>{
    resultsOverlay.classList.add('hidden');
    goToNewPhoto();
  });

  function goToNewPhoto(){
    stopTimer();
    gamePanel.classList.add('hidden');
    cameraPanel.classList.remove('hidden');
    cameraError.classList.add('hidden');
    startCameraBtn.classList.remove('hidden');
    takePhotoBtn.classList.add('hidden');
    startCameraBtn.disabled = false;
    startCameraBtn.textContent = '📷 Enable Camera';
    diffBtns.forEach(b=>b.classList.remove('selected'));
    startPuzzleBtn.disabled = true;
    startCamera();
  }

  restartBtn.addEventListener('click', ()=>{
    buildPuzzle();
  });
  resultsPlayAgainBtn.addEventListener('click', ()=>{
    resultsOverlay.classList.add('hidden');
    buildPuzzle();
  });

  /* ============================================================
     PUZZLE BUILD
  ============================================================ */
  function buildPuzzle(){
    stopTimer();
    gameWon = false;
    moves = 0;
    elapsedMs = 0;
    movesVal.textContent = '0';
    timerVal.textContent = '00:00.0';
    boardWrap.innerHTML = '';
    pieces = [];

    // compute board pixel size (square, responsive)
    boardPx = boardWrap.clientWidth || 560;
    cellSize = boardPx / gridSize;

    const total = gridSize * gridSize;
    correctVal.textContent = `0/${total}`;

    // background grid cells (visual reference, faint)
    for(let r=0;r<gridSize;r++){
      for(let c=0;c<gridSize;c++){
        const bg = document.createElement('div');
        bg.className = 'cell-bg';
        bg.style.width = cellSize + 'px';
        bg.style.height = cellSize + 'px';
        bg.style.left = (c*cellSize) + 'px';
        bg.style.top = (r*cellSize) + 'px';
        boardWrap.appendChild(bg);
      }
    }

    // build correct index list then shuffle (guaranteed solvable via solvable shuffle)
    let order = Array.from({length: total}, (_,i)=>i);
    order = solvableShuffle(order, gridSize);

    const imgSize = boardPx; // we'll scale background-image to board size
    for(let pos=0; pos<total; pos++){
      const correctIndex = order[pos];
      const correctRow = Math.floor(correctIndex / gridSize);
      const correctCol = correctIndex % gridSize;

      const el = document.createElement('div');
      el.className = 'piece';
      el.style.width = cellSize + 'px';
      el.style.height = cellSize + 'px';
      el.style.backgroundImage = `url(${capturedImage.src})`;
      el.style.backgroundSize = `${imgSize}px ${imgSize}px`;
      el.style.backgroundPosition = `-${correctCol*cellSize}px -${correctRow*cellSize}px`;

      const startRow = Math.floor(pos / gridSize);
      const startCol = pos % gridSize;
      const x = startCol * cellSize;
      const y = startRow * cellSize;
      el.style.left = x + 'px';
      el.style.top = y + 'px';

      const piece = {
        correctIndex,
        currentIndex: pos,
        el,
        x, y
      };
      el.dataset.correctIndex = correctIndex;
      pieces.push(piece);
      boardWrap.appendChild(el);

      attachDragHandlers(el, piece);
    }

    updateCorrectHighlights();
    startTimer();
  }

  /* Fisher-Yates shuffle, then verify/repair solvability for sliding-style
     puzzles isn't strictly needed here since this is a free swap puzzle
     (any permutation is solvable by swapping), but we ensure it's not
     already solved and has reasonable scrambling. */
  function solvableShuffle(arr, n){
    let a = arr.slice();
    do{
      for(let i=a.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [a[i],a[j]] = [a[j],a[i]];
      }
    } while(isAlreadySolved(a));
    return a;
  }
  function isAlreadySolved(a){
    for(let i=0;i<a.length;i++){
      if(a[i] !== i) return false;
    }
    return true;
  }

  /* ============================================================
     DRAG & TOUCH HANDLING
  ============================================================ */
  function attachDragHandlers(el, piece){
    el.addEventListener('mousedown', e=>startDrag(e, piece, false));
    el.addEventListener('touchstart', e=>startDrag(e, piece, true), {passive:false});
  }

  function getPoint(e, isTouch){
    if(isTouch){
      const t = e.touches[0] || e.changedTouches[0];
      return {x:t.clientX, y:t.clientY};
    }
    return {x:e.clientX, y:e.clientY};
  }

  function startDrag(e, piece, isTouch){
    if(gameWon) return;
    e.preventDefault();
    const pt = getPoint(e, isTouch);
    const boardRect = boardWrap.getBoundingClientRect();

    dragState = {
      piece,
      offsetX: pt.x - (boardRect.left + piece.x),
      offsetY: pt.y - (boardRect.top + piece.y),
      boardRect
    };
    piece.el.classList.add('dragging');
    boardWrap.appendChild(piece.el); // bring to front

    if(isTouch){
      document.addEventListener('touchmove', onDragMove, {passive:false});
      document.addEventListener('touchend', onDragEnd);
      document.addEventListener('touchcancel', onDragEnd);
    } else {
      document.addEventListener('mousemove', onDragMove);
      document.addEventListener('mouseup', onDragEnd);
    }
  }

  function onDragMove(e){
    if(!dragState) return;
    e.preventDefault();
    const isTouch = e.type === 'touchmove';
    const pt = getPoint(e, isTouch);
    const { piece, offsetX, offsetY, boardRect } = dragState;

    let nx = pt.x - boardRect.left - offsetX;
    let ny = pt.y - boardRect.top - offsetY;

    const maxPos = boardPx - cellSize;
    nx = Math.max(0, Math.min(maxPos, nx));
    ny = Math.max(0, Math.min(maxPos, ny));

    piece.el.style.left = nx + 'px';
    piece.el.style.top = ny + 'px';
  }

  function onDragEnd(e){
    if(!dragState) return;
    const isTouch = e.type === 'touchend' || e.type === 'touchcancel';
    document.removeEventListener('mousemove', onDragMove);
    document.removeEventListener('mouseup', onDragEnd);
    document.removeEventListener('touchmove', onDragMove);
    document.removeEventListener('touchend', onDragEnd);
    document.removeEventListener('touchcancel', onDragEnd);

    const { piece } = dragState;
    piece.el.classList.remove('dragging');

    // determine nearest cell
    const curLeft = parseFloat(piece.el.style.left);
    const curTop = parseFloat(piece.el.style.top);
    let col = Math.round(curLeft / cellSize);
    let row = Math.round(curTop / cellSize);
    col = Math.max(0, Math.min(gridSize-1, col));
    row = Math.max(0, Math.min(gridSize-1, row));
    const targetIndex = row * gridSize + col;

    const occupant = pieces.find(p => p.currentIndex === targetIndex && p !== piece);

    if(occupant && occupant !== piece){
      // swap positions
      const tmpIndex = piece.currentIndex;
      placeAtIndex(piece, targetIndex);
      placeAtIndex(occupant, tmpIndex);
      moves++;
      movesVal.textContent = String(moves);
    } else {
      // snap back to own current cell if dropped on empty/same spot
      placeAtIndex(piece, piece.currentIndex);
      // only count as a move if actually moved to new index (here it's same)
    }

    updateCorrectHighlights();
    checkWin();

    dragState = null;
  }

  function placeAtIndex(piece, index){
    const row = Math.floor(index / gridSize);
    const col = index % gridSize;
    piece.currentIndex = index;
    piece.x = col * cellSize;
    piece.y = row * cellSize;
    piece.el.style.left = piece.x + 'px';
    piece.el.style.top = piece.y + 'px';
  }

  function updateCorrectHighlights(){
    let correctCount = 0;
    pieces.forEach(p=>{
      if(p.currentIndex === p.correctIndex){
        p.el.classList.add('correct');
        correctCount++;
      } else {
        p.el.classList.remove('correct');
      }
    });
    correctVal.textContent = `${correctCount}/${pieces.length}`;
  }

  function checkWin(){
    const allCorrect = pieces.every(p => p.currentIndex === p.correctIndex);
    if(allCorrect && !gameWon){
      gameWon = true;
      stopTimer();
      showResults();
    }
  }

  /* ============================================================
     TIMER
  ============================================================ */
  function startTimer(){
    startTime = Date.now();
    elapsedMs = 0;
    if(timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(()=>{
      elapsedMs = Date.now() - startTime;
      timerVal.textContent = formatTime(elapsedMs);
    }, 100);
  }
  function stopTimer(){
    if(timerInterval){
      clearInterval(timerInterval);
      timerInterval = null;
    }
  }
  function formatTime(ms){
    const totalDeci = Math.floor(ms / 100);
    const minutes = Math.floor(totalDeci / 600);
    const seconds = Math.floor((totalDeci % 600) / 10);
    const tenths = totalDeci % 10;
    return `${pad2(minutes)}:${pad2(seconds)}.${tenths}`;
  }
  function pad2(n){ return n.toString().padStart(2,'0'); }

  /* ============================================================
     RESULTS + LEADERBOARD
  ============================================================ */
  const LB_KEY = 'facePuzzleLeaderboard';

  function diffLabel(n){
    if(n===3) return '3×3 (Easy)';
    if(n===4) return '4×4 (Medium)';
    return '5×5 (Hard)';
  }
  function diffClass(n){
    if(n===3) return 'easy';
    if(n===4) return 'medium';
    return 'hard';
  }

  function showResults(){
    resTime.textContent = formatTime(elapsedMs);
    resMoves.textContent = String(moves);
    resDiff.textContent = `${gridSize}×${gridSize}`;
    resultsSub.textContent = `You solved the ${diffLabel(gridSize)} puzzle.`;

    const isBest = saveScore();
    newBestBadge.classList.toggle('hidden', !isBest);

    resultsOverlay.classList.remove('hidden');
    renderLeaderboard();
  }

  function loadScores(){
    try{
      const raw = localStorage.getItem(LB_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){
      return [];
    }
  }

  function saveScore(){
    const scores = loadScores();
    const entry = {
      date: new Date().toLocaleDateString(),
      timeMs: elapsedMs,
      timeStr: formatTime(elapsedMs),
      moves: moves,
      difficulty: gridSize
    };
    scores.push(entry);
    // sort by difficulty desc (harder first) then time asc, but for "best 5 overall"
    // we'll keep top 5 fastest times overall across all difficulties played,
    // weighting isn't requested explicitly, so just sort by time ascending.
    scores.sort((a,b)=> a.timeMs - b.timeMs);
    const top5 = scores.slice(0,5);
    localStorage.setItem(LB_KEY, JSON.stringify(top5));

    // is this entry now in the saved top5 AND is it the fastest (rank 1)?
    const isBest = top5.length>0 && top5[0].timeMs === entry.timeMs && top5[0].moves === entry.moves && top5[0].difficulty === entry.difficulty;
    return isBest;
  }

  function renderLeaderboard(){
    const scores = loadScores();
    if(scores.length === 0){
      lbContent.innerHTML = '<div class="empty-lb">No times saved yet — solve a puzzle to claim the top spot!</div>';
      return;
    }
    let html = '<table class="lb"><thead><tr><th>#</th><th>Time</th><th>Moves</th><th>Difficulty</th><th>Date</th></tr></thead><tbody>';
    scores.forEach((s, i)=>{
      html += `<tr>
        <td>${i+1}</td>
        <td>${s.timeStr}</td>
        <td>${s.moves}</td>
        <td><span class="diff-tag ${diffClass(s.difficulty)}">${s.difficulty}×${s.difficulty}</span></td>
        <td>${s.date}</td>
      </tr>`;
    });
    html += '</tbody></table>';
    lbContent.innerHTML = html;
  }

  // initial leaderboard render
  renderLeaderboard();

  /* ============================================================
     RESPONSIVE: rebuild board layout on resize (debounced)
  ============================================================ */
  let resizeTimeout = null;
  window.addEventListener('resize', ()=>{
    if(gamePanel.classList.contains('hidden')) return;
    if(resizeTimeout) clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(()=>{
      relayoutBoard();
    }, 150);
  });

  function relayoutBoard(){
    if(pieces.length === 0) return;
    const newBoardPx = boardWrap.clientWidth || boardPx;
    if(Math.abs(newBoardPx - boardPx) < 1) return;
    boardPx = newBoardPx;
    cellSize = boardPx / gridSize;

    // update background cell sizes
    const bgCells = boardWrap.querySelectorAll('.cell-bg');
    let idx = 0;
    for(let r=0;r<gridSize;r++){
      for(let c=0;c<gridSize;c++){
        const cell = bgCells[idx++];
        if(cell){
          cell.style.width = cellSize + 'px';
          cell.style.height = cellSize + 'px';
          cell.style.left = (c*cellSize) + 'px';
          cell.style.top = (r*cellSize) + 'px';
        }
      }
    }

    pieces.forEach(p=>{
      p.el.style.width = cellSize + 'px';
      p.el.style.height = cellSize + 'px';
      p.el.style.backgroundSize = `${boardPx}px ${boardPx}px`;
      const correctRow = Math.floor(p.correctIndex / gridSize);
      const correctCol = p.correctIndex % gridSize;
      p.el.style.backgroundPosition = `-${correctCol*cellSize}px -${correctRow*cellSize}px`;
      placeAtIndex(p, p.currentIndex);
    });
  }

})();
</script>
</body>
</html>
